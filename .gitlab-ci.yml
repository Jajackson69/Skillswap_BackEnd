stages:
  - test
  - build
  - deploy

test:
  stage: test
  script:
    - .\gradlew.bat test --no-daemon

build-backend:
  stage: build
  script:
    - docker build -t skillswap-backend .

deploy:
  stage: deploy
  script:
    - $env:DB_PASSWORD = $env:DB_PASSWORD
    - docker compose up -d --build