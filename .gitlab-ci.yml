stages:
  - test
  - build
  - deploy

test:
  stage: test
  script:
    - .\gradlew.bat test --no-daemon

sonarqube-check:
  stage: test
  image: gradle:jre11-slim
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script: gradle sonar
  allow_failure: true
  only:
    - main

build-backend:
  stage: build
  script:
    - docker build -t skillswap-backend .

deploy:
  stage: deploy
  script:
    - $env:DB_PASSWORD = $env:DB_PASSWORD
    - docker compose up -d --build
