stages:
  - build
  - test
  - deploy

build-backend:
  stage: build
  script:
    - docker build -t skillswap-backend .

test:
  stage: test
  script:
    - .\gradlew.bat test jacocoTestReport --no-daemon
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: jacoco
        path: build/reports/jacoco/test/jacocoTestReport.xml
    paths:
      - build/reports/jacoco/
    expire_in: 1 week

sonarqube-check:
  stage: test
  needs:
    - job: test
      artifacts: true
  script:
    - .\gradlew.bat sonar --no-daemon "-Dsonar.token=$env:SONAR_TOKEN" "-Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml"
  allow_failure: true
  only:
    - main

deploy:
  stage: deploy
  script:
    - docker compose up -d --build