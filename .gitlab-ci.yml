stages:
  - build
  - test
  - deploy

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

build-job:
  stage: build
  script:
    - powershell -Command "if (Test-Path .gradle) { Remove-Item -Recurse -Force .gradle }"
    - powershell -Command "if (Test-Path build) { Remove-Item -Recurse -Force build }"
    - java -version
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - build/libs/

test-job:
  stage: test
  script:
    - ./gradlew test
  artifacts:
    when: always
    paths:
      - build/test-results/test/
      - build/reports/tests/test/

deploy-prod:
  stage: deploy
  script:
    - echo "Deploying branch $CI_COMMIT_BRANCH to production..."
  environment: production
  only:
    - main